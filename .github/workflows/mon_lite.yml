name: MON Lite 2.x consistency

on:
  pull_request:
    paths:
      - mon.php
      - monitor.md
      - MON-Wiki.md
      - mon_data.json
      - mon_result.md
      - mon_chatgpt_handoff.json
      - mon_chatgpt_response.json
      - .github/workflows/mon_lite.yml
  push:
    branches: [main]
    paths:
      - mon.php
      - monitor.md
      - MON-Wiki.md
      - mon_data.json
      - mon_result.md
      - mon_chatgpt_handoff.json
      - mon_chatgpt_response.json
      - .github/workflows/mon_lite.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: curl,zlib,json
          coverage: none

      - name: PHP 7.4 syntax
        run: |
          set -eu
          php -v
          php -l mon.php

      - name: MON policy and active-file consistency
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys

          root = pathlib.Path('.')
          src = (root/'mon.php').read_text(encoding='utf-8')
          prompt = (root/'monitor.md').read_text(encoding='utf-8')
          wiki = (root/'MON-Wiki.md').read_text(encoding='utf-8')

          version = re.search(r"MON_LITE_VERSION\s*=\s*'([^']+)'", src)
          policy = re.search(r"MON_LITE_POLICY\s*=\s*'([^']+)'", src)
          build = re.search(r"MON_LITE_BUILD\s*=\s*'([^']+)'", src)
          assert version and version.group(1) == '2.2.3'
          assert policy and policy.group(1) == 'MON-LITE-OPS-2.2.3'
          assert build and build.group(1) == 'MON-LITE-2.2.3-20261017-r7'

          for text, name in [(prompt,'monitor.md'),(wiki,'MON-Wiki.md')]:
              assert 'MON-LITE-OPS-2.2.3' in text, name
              assert '2.2.3' in text, name

          assert '유일한 실행 권위 지시문' in prompt
          assert '비권위 요약' in wiki
          assert 'mon_chatgpt_bridge.php' in prompt and '사용하지 않는다' in prompt

          data = json.loads((root/'mon_data.json').read_text(encoding='utf-8'))
          hand = json.loads((root/'mon_chatgpt_handoff.json').read_text(encoding='utf-8'))
          resp = json.loads((root/'mon_chatgpt_response.json').read_text(encoding='utf-8'))

          assert data['policy'] == 'MON-LITE-OPS-2.2.3'
          assert data['version'] == '2.2.3'
          assert data['build'].startswith('MON-LITE-2.2.3-')
          assert hand['policy'] == 'MON-LITE-OPS-2.2.3'
          assert resp['policy'] == 'MON-LITE-OPS-2.2.3'
          assert hand['contract'] == 'MON-LITE-BRIDGE-1.0'
          assert resp['contract'] == 'MON-LITE-BRIDGE-1.0'

          assert not (root/'mon_chatgpt_bridge.php').exists()
          assert not (root/'mon_wiki.md').exists()

          expected = {
              '.github/workflows/mon_lite.yml','AGENTS.md','CHANGE_GATE.md','MON-Wiki.md','mon.php',
              'mon_chatgpt_handoff.json','mon_chatgpt_response.json','mon_data.json','mon_result.md','monitor.md'
          }
          actual = {p.as_posix() for p in root.rglob('*') if p.is_file() and '.git' not in p.parts}
          assert actual == expected, (sorted(actual-expected), sorted(expected-actual))

          print('MON consistency PASS')
          PY

      - name: Candidate identity and CLI preflight
        run: |
          set -eu
          php -r 'require "mon.php"; $r=new ReflectionClass("LiteMonitor"); $m=$r->getMethod("symbolFromId"); $m->setAccessible(true); if (!$m->invoke(null,"KR|KOSPI|005930")) exit(1); if ($m->invoke(null,"KR|NASDAQ|005930")!==null) exit(2); if (!$m->invoke(null,"US|NASDAQ|BRK.B")) exit(3); if (LiteYahoo::ticker(["country"=>"US","symbol"=>"BRK.B","exchange"=>"NYSE"])!=="BRK-B") exit(4); echo "candidate identity PASS\n";'
          php -r 'require "mon.php"; $c=new LiteConfig(); $c->githubToken="synthetic-ci-token"; $h=LiteHealth::local($c,true); if (!is_array($h["cli_probe"]) || !$h["cli_probe"]["checked"] || !$h["cli_probe"]["ok"]) {fwrite(STDERR,json_encode($h)); exit(1);} echo "CLI preflight PASS\n";'
          rm -rf mon_runtime

      - name: Low-memory adaptive batching
        run: |
          set -eu
          php -r 'require "mon.php"; $m=LiteResource::memoryInfo("MemTotal: 262144 kB\nMemFree: 12000 kB\nBuffers: 3000 kB\nCached: 18000 kB\nSReclaimable: 4000 kB\nShmem: 1000 kB\n"); if ($m["source"]!=="reclaimable_estimate" || $m["available_bytes"]!==36000*1024) {var_export($m); exit(1);} echo "legacy meminfo PASS\n";'
          php -r 'require "mon.php"; foreach ([[31,3],[26,2],[21,1],[19,0]] as $x) { $r=["memory_available_bytes"=>$x[0]*1048576]; if (LiteMonitor::lowMemoryBatch($r)!==$x[1]) exit(1);} echo "low-memory batch PASS\n";'
          grep -F "const LOW_MEMORY_RETRY_SECONDS=120;" mon.php\n          grep -F "WATCHLIST_FALLBACK_UNAVAILABLE" mon.php
          grep -F "full_resync_pending" mon.php
          rm -rf mon_runtime

      - name: Provider data recovery
        run: |
          set -eu
          php -r 'require "mon.php"; $rows=[["2026-01-01",100,101,99,100,10],["2026-01-02",100,90,95,100,10],["2026-01-03",101,102,100,101,10]]; $x=LiteYahoo::sanitizeProviderRows($rows); if ($x["dropped"]!==1 || count($x["rows"])!==2) {var_export($x); exit(1);} echo "isolated old bad bar recovery PASS\n";'
          php -r 'require "mon.php"; $ok=false; try {LiteYahoo::sanitizeProviderRows([["2026-01-01",100,101,99,100,10],["2026-01-02",100,90,95,100,10]]);} catch (LiteMonFault $e) {$ok=$e->faultCode==="YAHOO_LATEST_BAR_INVALID";} if(!$ok) exit(1); echo "latest bad bar protection PASS\n";'
          php -r 'require "mon.php"; $x=LiteYahoo::benchmarkCandidates("JP"); if ($x!==["^TOPX","1306.T","^N225"]) {var_export($x); exit(1);} echo "JP benchmark fallback policy PASS\n";'
          rm -rf mon_runtime

      - name: Always-three MS7 recommendation contract
        run: |
          set -eu
          php -r 'require "mon.php"; $a=["metrics"=>["RS20_pp"=>5,"last_close"=>110,"MA5"=>105,"MA20"=>100],"technical"=>["technical_qualified"=>true,"histogram"=>1]]; $m=LiteSwing::ms7FromAnalysis($a); if($m["code"]!=="M2") {var_export($m); exit(1);} echo "MS7 strong mapping PASS\n";'
          php -r 'require "mon.php"; $r=LiteMonitor::recommendThree([],[]); foreach(["KR","US","JP"] as $c){if(count($r[$c])!==3) exit(1); foreach($r[$c] as $x) if(($x["ms7"]["code"]??"")!=="W") exit(2);} echo "always-three fallback PASS\n";'
          php -r 'require "mon.php"; $rows=[["symbol_id"=>"KR|KOSPI|111111","country"=>"KR","name"=>"A","metrics"=>["RS20_pp"=>4,"R20"=>.1,"ADV20"=>100,"last_close"=>110,"MA5"=>105,"MA20"=>100],"technical"=>["technical_qualified"=>true,"histogram"=>1],"reason_codes"=>[]]]; $r=LiteMonitor::recommendThree($rows,["KR|KOSPI|111111","KR|KOSPI|222222","KR|KOSPI|333333"]); if(count($r["KR"])!==3||$r["KR"][0]["ms7"]["code"]!=="M2") exit(1); echo "evaluated plus pending fill PASS\n";'
          rm -rf mon_runtime
      - name: Persisted JSON object normalization
        run: |
          php -r 'require "mon.php"; $x=json_decode("{\"results\":[{\"eligible\":true,\"metrics\":{\"RS20_pp\":10}}]}"); $a=lm_array($x); if (!is_array($a) || !is_array($a["results"][0]) || !is_array($a["results"][0]["metrics"])) exit(1); echo "persisted normalization PASS\\n";'

      - name: Low-load runtime invariants
        run: |
          set -eu
          grep -F "const MAX_FILES = 11;" mon.php
          grep -F "const MAX_TOTAL = 67108864;" mon.php
          grep -F "const MAX_FILE = 16777216;" mon.php
          grep -F "const LIGHT_SECONDS=1800;" mon.php
          grep -F "const MAILBOX_SECONDS=300;" mon.php
          grep -F "const FULL_RESYNC_SECONDS=604800;" mon.php
          grep -F "no cron / no orders" mon.php

      - name: Source identities
        run: sha256sum mon.php monitor.md MON-Wiki.md mon_data.json mon_result.md mon_chatgpt_handoff.json mon_chatgpt_response.json
