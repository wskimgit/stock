              foreach(LiteRuntime::FILES as $key){$path=LiteRuntime::path($key.'.php');if(is_file($path))unlink($path);}$bars=[];for($j=0;$j<220;$j++)$bars[]=[gmdate('Y-m-d',1600000000+$j*86400),100+$j,103+$j,99+$j,102+$j,100000];$old=['symbol_id'=>'US|NASDAQ|CIOLD','symbol'=>'CIOLD','country'=>'US','exchange'=>'NASDAQ','currency'=>'USD','name'=>'Previous fixture'];
              $cache=(object)['contract'=>'MON-LITE-CACHE-1.2','watchlist'=>[$old],'symbols'=>(object)[$old['symbol_id']=>(object)['status'=>'ok','symbol'=>(object)$old]],'benchmarks'=>(object)['US'=>$bars],'benchmark_meta'=>(object)['US'=>(object)['checked_at'=>lm_iso()]],'last_full_resync_at'=>lm_iso(),'full_resync_pending'=>false,'scan_queue'=>[$old['symbol_id']]];LiteRuntime::write('cache',$cache);unset($cache);
              $config=new LiteConfig();$config->githubToken='synthetic-ci-token';$http=new MemCandidateHttp();$http->seed('mon_data.json',lm_json(['contract'=>'MON-LITE-DATA-2.2','policy'=>MON_LITE_POLICY,'watchlist'=>['symbols'=>[]]]));$http->seed('mon_chatgpt_handoff.json',lm_json(['contract'=>'MON-LITE-BRIDGE-1.0','policy'=>MON_LITE_POLICY,'stage'=>'candidates','request_id'=>'ci-new-watch','candidate_ids'=>['US|NASDAQ|CINEW']]));$yahoo=new MemCandidateYahoo($bars);$monitor=(new ReflectionClass(LiteMonitor::class))->newInstanceWithoutConstructor();foreach(['cfg'=>$config,'http'=>$http,'yahoo'=>$yahoo] as $name=>$value)mem_prop($monitor,$name,$value,true);$state=LiteMonitor::defaultState();$state->last_full_scan=lm_iso();$monitor->saveState($state);
