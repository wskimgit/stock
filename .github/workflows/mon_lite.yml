name: MON Lite 2.x consistency

on:
  pull_request:
    paths:
      - mon.php
      - monitor.md
      - MON-Wiki.md
      - mon_data.json
      - mon_result.md
      - mon_chatgpt_handoff.json
      - mon_chatgpt_response.json
      - .github/workflows/mon_lite.yml
  push:
    branches: [main]
    paths:
      - mon.php
      - monitor.md
      - MON-Wiki.md
      - mon_data.json
      - mon_result.md
      - mon_chatgpt_handoff.json
      - mon_chatgpt_response.json
      - .github/workflows/mon_lite.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: curl,zlib,json
          coverage: none

      - name: PHP 7.4 syntax
        run: |
          set -eu
          php -v
          php -l mon.php

      - name: MON policy and active-file consistency
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys

          root = pathlib.Path('.')
          src = (root/'mon.php').read_text(encoding='utf-8')
          prompt = (root/'monitor.md').read_text(encoding='utf-8')
          wiki = (root/'MON-Wiki.md').read_text(encoding='utf-8')

          version = re.search(r"MON_LITE_VERSION\s*=\s*'([^']+)'", src)
          policy = re.search(r"MON_LITE_POLICY\s*=\s*'([^']+)'", src)
          build = re.search(r"MON_LITE_BUILD\s*=\s*'([^']+)'", src)
          assert version and version.group(1) == '2.2.3'
          assert policy and policy.group(1) == 'MON-LITE-OPS-2.2.3'
          assert build and build.group(1) == 'MON-LITE-2.2.3-20261020-r16'

          for text, name in [(prompt,'monitor.md'),(wiki,'MON-Wiki.md')]:
              assert 'MON-LITE-OPS-2.2.3' in text, name
              assert '2.2.3' in text, name

          assert '유일한 실행 권위 지시문' in prompt
          assert '비권위 요약' in wiki
          assert 'mon_chatgpt_bridge.php' in prompt and '사용하지 않는다' in prompt
          assert '최종 추천 권한은 ChatGPT decision에만 있다' in prompt
          assert 'PHP/MON 참고순위나 참고 MS7을 ChatGPT 최종 결정으로 자동 승격' in prompt
          assert 'ChatGPT final decision' in wiki

          data = json.loads((root/'mon_data.json').read_text(encoding='utf-8'))
          hand = json.loads((root/'mon_chatgpt_handoff.json').read_text(encoding='utf-8'))
          resp = json.loads((root/'mon_chatgpt_response.json').read_text(encoding='utf-8'))

          assert data['policy'] == 'MON-LITE-OPS-2.2.3'
          assert data['version'] == '2.2.3'
          assert data['build'].startswith('MON-LITE-2.2.3-')
          assert hand['policy'] == 'MON-LITE-OPS-2.2.3'
          assert resp['policy'] == 'MON-LITE-OPS-2.2.3'
          assert hand['contract'] == 'MON-LITE-BRIDGE-1.0'
          assert resp['contract'] == 'MON-LITE-BRIDGE-1.0'

          assert not (root/'mon_chatgpt_bridge.php').exists()
          assert not (root/'mon_wiki.md').exists()

          expected = {
              '.github/workflows/mon_lite.yml','AGENTS.md','CHANGE_GATE.md','MON-Wiki.md','mon.php',
              'mon_chatgpt_handoff.json','mon_chatgpt_response.json','mon_data.json','mon_result.md','monitor.md'
          }
          actual = {p.as_posix() for p in root.rglob('*') if p.is_file() and '.git' not in p.parts}
          # Other explicitly restored systems are outside MON maintenance scope.
          optional_authorized = {'reporting.md', 'mgdaemon.md', 'STC14.json'}
          assert expected <= actual and actual <= expected | optional_authorized, (sorted(actual-expected-optional_authorized), sorted(expected-actual))

          print('MON consistency PASS')
          PY

      - name: Candidate identity and CLI preflight
        run: |
          set -eu
          php -r 'require "mon.php"; $r=new ReflectionClass("LiteMonitor"); $m=$r->getMethod("symbolFromId"); $m->setAccessible(true); if (!$m->invoke(null,"KR|KOSPI|005930")) exit(1); if ($m->invoke(null,"KR|NASDAQ|005930")!==null) exit(2); if (!$m->invoke(null,"US|NASDAQ|BRK.B")) exit(3); if (LiteYahoo::ticker(["country"=>"US","symbol"=>"BRK.B","exchange"=>"NYSE"])!=="BRK-B") exit(4); echo "candidate identity PASS\n";'
          php -r 'require "mon.php"; $c=new LiteConfig(); $c->githubToken="synthetic-ci-token"; $h=LiteHealth::local($c,true); if (!is_array($h["cli_probe"]) || !$h["cli_probe"]["checked"] || !$h["cli_probe"]["ok"]) {fwrite(STDERR,json_encode($h)); exit(1);} echo "CLI preflight PASS\n";'
          rm -rf mon_runtime

      - name: Low-memory adaptive batching
        run: |
          set -eu
          php -r 'require "mon.php"; $m=LiteResource::memoryInfo("MemTotal: 262144 kB\nMemFree: 12000 kB\nBuffers: 3000 kB\nCached: 18000 kB\nSReclaimable: 4000 kB\nShmem: 1000 kB\n"); if ($m["source"]!=="reclaimable_estimate" || $m["available_bytes"]!==36000*1024) {var_export($m); exit(1);} echo "legacy meminfo PASS\n";'
          php -r 'require "mon.php"; foreach ([[31,3],[26,2],[21,1],[19,0]] as $x) { $r=["memory_available_bytes"=>$x[0]*1048576]; if (LiteMonitor::lowMemoryBatch($r)!==$x[1]) exit(1);} echo "low-memory batch PASS\n";'
          grep -F "const LOW_MEMORY_RETRY_SECONDS=120;" mon.php
          grep -F "WATCHLIST_FALLBACK_UNAVAILABLE" mon.php
          grep -F "full_resync_pending" mon.php
          rm -rf mon_runtime

      - name: PHP headroom and bounded cycle memory
        run: |
          set -eu
          test_dir="$(mktemp -d)"
          trap 'rm -rf "$test_dir"' EXIT
          cp mon.php "$test_dir/mon.php"
          cmp -s mon.php "$test_dir/mon.php"
          cat >"$test_dir/memory-fixture.php" <<'PHP'
          <?php
          declare(strict_types=1);
          require getenv('MON_TEST_SOURCE');
          function mem_assert(bool $ok,string $message): void {if(!$ok)throw new RuntimeException($message);}
          function mem_prop($object,string $name,$value=null,bool $write=false) {$p=new ReflectionProperty(get_class($object),$name);$p->setAccessible(true);if($write){$p->setValue($object,$value);return null;}return $p->getValue($object);}
          function mem_call($object,string $name,array $args=[]) {$m=new ReflectionMethod(get_class($object),$name);$m->setAccessible(true);return $m->invokeArgs($object,$args);}
          function mem_end(LiteMonitor $monitor): void {mem_call($monitor,method_exists($monitor,'endTurn')?'endTurn':'releaseMemory');}
          function mem_seed(LiteHttp $http,LiteYahoo $yahoo,int $cycle): void {
              $known=[];foreach(['mon_data.json'=>3145728,'mon_chatgpt_response.json'=>2097152,'mon_result.md'=>1048576,'mon_chatgpt_handoff.json'=>4096] as $name=>$bytes)$known[$name]=['content'=>str_repeat(chr(65+$cycle%20),$bytes),'sha'=>sha1($name.$cycle),'etag'=>'ci-'.$name.'-'.$cycle,'commit_sha'=>null];
              mem_prop($http,'githubKnown',$known,true);mem_prop($http,'githubTurn',$known,true);
              $ranges=[];for($i=0;$i<150;$i++){$rows=[];for($j=0;$j<40;$j++)$rows[]=[gmdate('Y-m-d',1600000000+$j*86400),100+$i+$j,102+$i+$j,99+$i+$j,101+$i+$j,1000+$j];$ranges['CI'.$i]=['p1'=>1600000000,'p2_day'=>'2026-10-19','rows'=>$rows];}mem_prop($yahoo,'rangeCache',$ranges,true);
          }
          $mode=getenv('MON_MEMORY_MODE')?:'retained';$expect=getenv('MON_EXPECT_R14')==='1';
          if($mode==='retained'){
              $config=new LiteConfig();$http=new LiteHttp($config);$yahoo=new LiteYahoo($http);$monitor=(new ReflectionClass(LiteMonitor::class))->newInstanceWithoutConstructor();foreach(['cfg'=>$config,'http'=>$http,'yahoo'=>$yahoo] as $name=>$value)mem_prop($monitor,$name,$value,true);
              mem_end($monitor);$base=memory_get_usage(false);$idle=[];$active=[];
              for($cycle=0;$cycle<12;$cycle++){mem_seed($http,$yahoo,$cycle);$active[]=memory_get_usage(false);mem_end($monitor);$idle[]=memory_get_usage(false);}
              $bodyBytes=0;foreach((array)mem_prop($http,'githubKnown') as $entry)$bodyBytes+=strlen((string)($entry['content']??''));$ranges=count((array)mem_prop($yahoo,'rangeCache'));
              $report=['scenario'=>'retained_cache_cycles','cycles'=>12,'baseline_bytes'=>$base,'active_max_bytes'=>max($active),'idle_first_bytes'=>$idle[0],'idle_last_bytes'=>end($idle),'retained_last_bytes'=>end($idle)-$base,'idle_growth_bytes'=>end($idle)-$idle[0],'retained_http_body_bytes'=>$bodyBytes,'retained_yahoo_entries'=>$ranges,'peak_allocated_bytes'=>memory_get_peak_usage(true),'source_sha256'=>hash_file('sha256',getenv('MON_TEST_SOURCE'))];
              if($expect){mem_assert($report['retained_last_bytes']<1048576,'cycle cleanup must release megabyte payloads');mem_assert($report['idle_growth_bytes']<262144,'repeated cycles must not accumulate retained payloads');mem_assert($bodyBytes<=262144,'retained HTTP body budget');mem_assert($ranges===0,'Yahoo payloads must be released before idle');}
              echo lm_json($report)."\n";exit(0);
          }
          if($mode==='write'){
              $payload=(object)['rows'=>str_repeat('A',6291456)];LiteRuntime::write('cache',$payload);$payload->rows=str_repeat('B',6291456);$before=memory_get_usage(false);LiteRuntime::write('cache',$payload);$saved=LiteRuntime::read('cache');mem_assert(strlen($saved->rows)===6291456&&$saved->rows[0]==='B','large replacement must preserve exact data');unset($saved);
              if($expect)mem_assert(memory_get_peak_usage(true)<26*1048576,'6MiB replacement peak must remain below 26MiB');echo lm_json(['scenario'=>'six_mib_json_replacement','baseline_bytes'=>$before,'peak_allocated_bytes'=>memory_get_peak_usage(true),'peak_used_bytes'=>memory_get_peak_usage(false),'source_sha256'=>hash_file('sha256',getenv('MON_TEST_SOURCE'))])."\n";exit(0);
          }
          if($mode==='headroom'){
              foreach([['-1',null],['96M',100663296],['64m',67108864],['1G',1073741824],['52428800',52428800],['512K',524288],['bad-limit',null]] as $x)mem_assert(LiteResource::limitBytes($x[0])===$x[1],'PHP memory limit parsing: '.$x[0]);
              foreach([[64,32,3],[64,20,3],[64,19,2],[64,12,2],[64,11,1],[64,8,1],[64,7,0],[26,32,2],[21,32,1],[19,32,0]] as $x){$resource=['memory_available_bytes'=>$x[0]*1048576,'php_memory_headroom_bytes'=>$x[1]*1048576];mem_assert(LiteMonitor::lowMemoryBatch($resource)===$x[2],'host/PHP batching: '.lm_json($x));}
              $sample=LiteResource::sample();mem_assert($sample['php_memory_limit_bytes']===41943040,'40MiB configured limit reported');$held=str_repeat('H',25*1048576);$pressure=LiteResource::sample();
              mem_assert($pressure['php_memory_headroom_bytes']<16*1048576,'actual allocation reduces headroom');mem_assert($pressure['heavy_allowed']===false,'low PHP headroom blocks heavy scan even with available host memory');mem_assert(LiteMonitor::lowMemoryBatch($pressure)<=2,'actual PHP pressure limits retry batch');mem_assert($pressure['effective_memory_available_bytes']<=$pressure['php_memory_headroom_bytes'],'effective memory respects PHP budget');
              echo lm_json(['scenario'=>'actual_php_headroom','before'=>$sample,'under_pressure'=>$pressure,'source_sha256'=>hash_file('sha256',getenv('MON_TEST_SOURCE'))])."\n";exit(0);
          }
          if($mode==='cache'){
              $config=new LiteConfig();$config->githubToken='synthetic-ci-token';$http=new LiteHttp($config);
              for($i=0;$i<8;$i++){$item=['content'=>str_repeat(chr(65+$i),170000),'sha'=>sha1('ci-'.$i),'etag'=>'ci-etag-'.$i,'commit_sha'=>null];mem_call($http,'remember',['ci-'.$i,$item]);$known=(array)mem_prop($http,'githubKnown');$bytes=0;foreach($known as $entry)if(is_array($entry))$bytes+=strlen($entry['content']);mem_assert(count($known)<=4&&$bytes<=524288,'HTTP cache enforces aggregate budget during requests');}
              $latest=$http->githubGet('ci-7');mem_assert($latest['content']===str_repeat('H',170000)&&$http->stats()['github_body_cache_hits']===1,'small latest response remains a useful cache hit');mem_call($http,'remember',['oversize',['content'=>str_repeat('X',262145),'sha'=>'ci-large','etag'=>'ci-large']]);mem_assert(!array_key_exists('oversize',(array)mem_prop($http,'githubKnown'))&&!array_key_exists('oversize',(array)mem_prop($http,'githubTurn')),'large body is not retained');$http->releasePayloads();mem_assert((array)mem_prop($http,'githubTurn')===[],'cycle release clears request payload references');mem_assert(isset(mem_prop($http,'githubKnown')['ci-7']['etag']),'bounded small ETag remains reusable');
              echo lm_json(['scenario'=>'bounded_http_cache','known_entries'=>count((array)mem_prop($http,'githubKnown')),'known_body_bytes'=>$bytes,'source_sha256'=>hash_file('sha256',getenv('MON_TEST_SOURCE'))])."\n";exit(0);
          }
          if($mode==='yahoo'){
