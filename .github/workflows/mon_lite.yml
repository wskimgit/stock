          }
          if($mode==='queue'){
              final class MemQueueHttp {public function clearRequestCache(): void {}public function resetStats(): void {}public function stats(): array {return [];}public function githubGet(string $path,bool $force=false): ?array {return null;}public function releasePayloads(): void {}}
              final class MemQueueYahoo {public $calls=[],$bars;public function __construct(array $bars){$this->bars=$bars;}public function beginTurn(): void {}public function releasePayloads(): void {}public function stats(): array {return [];}public function recent(array $s,string $last,int $overlap=21): array {$this->calls[]=$s['symbol_id'];return $this->bars;}public function daily(array $s,int $days=220): array {$this->calls[]=$s['symbol_id'];return $this->bars;}public function benchmark(): array {return $this->bars;}}
