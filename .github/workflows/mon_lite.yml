              $transport=new MemYahooTransport();$yahoo=(new ReflectionClass(LiteYahoo::class))->newInstanceWithoutConstructor();mem_prop($yahoo,'http',$transport,true);$yahoo->beginTurn();$symbols=[];
              for($i=0;$i<300;$i++){$s=['symbol'=>'CI'.$i,'country'=>'US','exchange'=>'NASDAQ','currency'=>'USD'];$symbols[]=$s;$rows=$yahoo->daily($s,60);mem_assert(count($rows)===60&&$rows[59][4]===160.0,'bounded cache preserves complete provider output');mem_assert(count((array)mem_prop($yahoo,'rangeCache'))<=48,'Yahoo cache bounded during a long scan');if($i===34){$calls=$transport->calls;foreach($symbols as $recentSymbol)$yahoo->recent($recentSymbol,$rows[59][0],10);mem_assert($transport->calls===$calls,'35-symbol normal scan keeps cached rechecks');}}
              $latest=$symbols[299];$calls=$transport->calls;$reuse=$yahoo->recent($latest,$rows[59][0],10);mem_assert($transport->calls===$calls&&count($reuse)>0,'recent recheck still reuses latest cached ticker');$yahoo->releasePayloads();mem_assert(count((array)mem_prop($yahoo,'rangeCache'))===0,'Yahoo explicit release clears rows');
