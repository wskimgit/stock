              $latest=$symbols[299];$calls=$transport->calls;$reuse=$yahoo->recent($latest,$rows[59][0],10);mem_assert($transport->calls===$calls&&count($reuse)>0,'recent recheck still reuses latest cached ticker');$yahoo->releasePayloads();mem_assert(count((array)mem_prop($yahoo,'rangeCache'))===0,'Yahoo explicit release clears rows');
