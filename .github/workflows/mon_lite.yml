name: MON Lite 2.x consistency

on:
  pull_request:
    paths:
      - mon.php
      - monitor.md
      - MON-Wiki.md
      - mon_data.json
      - mon_result.md
      - mon_chatgpt_handoff.json
      - mon_chatgpt_response.json
      - .github/workflows/mon_lite.yml
  push:
    branches: [main]
    paths:
      - mon.php
      - monitor.md
      - MON-Wiki.md
      - mon_data.json
      - mon_result.md
      - mon_chatgpt_handoff.json
      - mon_chatgpt_response.json
      - .github/workflows/mon_lite.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: curl,zlib,json
          coverage: none

      - name: PHP 7.4 syntax
        run: |
          set -eu
          php -v
          php -l mon.php

      - name: MON policy and active-file consistency
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys

          root = pathlib.Path('.')
          src = (root/'mon.php').read_text(encoding='utf-8')
          prompt = (root/'monitor.md').read_text(encoding='utf-8')
          wiki = (root/'MON-Wiki.md').read_text(encoding='utf-8')

          version = re.search(r"MON_LITE_VERSION\s*=\s*'([^']+)'", src)
          policy = re.search(r"MON_LITE_POLICY\s*=\s*'([^']+)'", src)
          build = re.search(r"MON_LITE_BUILD\s*=\s*'([^']+)'", src)
          assert version and version.group(1) == '2.2.3'
          assert policy and policy.group(1) == 'MON-LITE-OPS-2.2.3'
          assert build and build.group(1) == 'MON-LITE-2.2.3-20261017-r13'

          for text, name in [(prompt,'monitor.md'),(wiki,'MON-Wiki.md')]:
              assert 'MON-LITE-OPS-2.2.3' in text, name
              assert '2.2.3' in text, name

          assert '유일한 실행 권위 지시문' in prompt
          assert '비권위 요약' in wiki
          assert 'mon_chatgpt_bridge.php' in prompt and '사용하지 않는다' in prompt
          assert '최종 추천 권한은 ChatGPT decision에만 있다' in prompt
          assert 'PHP/MON 참고순위나 참고 MS7을 ChatGPT 최종 결정으로 자동 승격' in prompt
          assert 'ChatGPT final decision' in wiki

          data = json.loads((root/'mon_data.json').read_text(encoding='utf-8'))
          hand = json.loads((root/'mon_chatgpt_handoff.json').read_text(encoding='utf-8'))
          resp = json.loads((root/'mon_chatgpt_response.json').read_text(encoding='utf-8'))

          assert data['policy'] == 'MON-LITE-OPS-2.2.3'
          assert data['version'] == '2.2.3'
          assert data['build'].startswith('MON-LITE-2.2.3-')
          assert hand['policy'] == 'MON-LITE-OPS-2.2.3'
          assert resp['policy'] == 'MON-LITE-OPS-2.2.3'
          assert hand['contract'] == 'MON-LITE-BRIDGE-1.0'
          assert resp['contract'] == 'MON-LITE-BRIDGE-1.0'

          assert not (root/'mon_chatgpt_bridge.php').exists()
          assert not (root/'mon_wiki.md').exists()

          expected = {
              '.github/workflows/mon_lite.yml','AGENTS.md','CHANGE_GATE.md','MON-Wiki.md','mon.php',
              'mon_chatgpt_handoff.json','mon_chatgpt_response.json','mon_data.json','mon_result.md','monitor.md'
          }
          actual = {p.as_posix() for p in root.rglob('*') if p.is_file() and '.git' not in p.parts}
          assert actual == expected, (sorted(actual-expected), sorted(expected-actual))

          print('MON consistency PASS')
          PY

      - name: Candidate identity and CLI preflight
        run: |
          set -eu
          php -r 'require "mon.php"; $r=new ReflectionClass("LiteMonitor"); $m=$r->getMethod("symbolFromId"); $m->setAccessible(true); if (!$m->invoke(null,"KR|KOSPI|005930")) exit(1); if ($m->invoke(null,"KR|NASDAQ|005930")!==null) exit(2); if (!$m->invoke(null,"US|NASDAQ|BRK.B")) exit(3); if (LiteYahoo::ticker(["country"=>"US","symbol"=>"BRK.B","exchange"=>"NYSE"])!=="BRK-B") exit(4); echo "candidate identity PASS\n";'
          php -r 'require "mon.php"; $c=new LiteConfig(); $c->githubToken="synthetic-ci-token"; $h=LiteHealth::local($c,true); if (!is_array($h["cli_probe"]) || !$h["cli_probe"]["checked"] || !$h["cli_probe"]["ok"]) {fwrite(STDERR,json_encode($h)); exit(1);} echo "CLI preflight PASS\n";'
          rm -rf mon_runtime

      - name: Low-memory adaptive batching
        run: |
          set -eu
          php -r 'require "mon.php"; $m=LiteResource::memoryInfo("MemTotal: 262144 kB\nMemFree: 12000 kB\nBuffers: 3000 kB\nCached: 18000 kB\nSReclaimable: 4000 kB\nShmem: 1000 kB\n"); if ($m["source"]!=="reclaimable_estimate" || $m["available_bytes"]!==36000*1024) {var_export($m); exit(1);} echo "legacy meminfo PASS\n";'
          php -r 'require "mon.php"; foreach ([[31,3],[26,2],[21,1],[19,0]] as $x) { $r=["memory_available_bytes"=>$x[0]*1048576]; if (LiteMonitor::lowMemoryBatch($r)!==$x[1]) exit(1);} echo "low-memory batch PASS\n";'
          grep -F "const LOW_MEMORY_RETRY_SECONDS=120;" mon.php
          grep -F "WATCHLIST_FALLBACK_UNAVAILABLE" mon.php
          grep -F "full_resync_pending" mon.php
          rm -rf mon_runtime

      - name: Provider data recovery
        run: |
          set -eu
          php -r 'require "mon.php"; $rows=[["2026-01-01",100,101,99,100,10],["2026-01-02",100,90,95,100,10],["2026-01-03",101,102,100,101,10]]; $x=LiteYahoo::sanitizeProviderRows($rows); if ($x["dropped"]!==1 || count($x["rows"])!==2) {var_export($x); exit(1);} echo "isolated old bad bar recovery PASS\n";'
          php -r 'require "mon.php"; $ok=false; try {LiteYahoo::sanitizeProviderRows([["2026-01-01",100,101,99,100,10],["2026-01-02",100,90,95,100,10]]);} catch (LiteMonFault $e) {$ok=$e->faultCode==="YAHOO_LATEST_BAR_INVALID";} if(!$ok) exit(1); echo "latest bad bar protection PASS\n";'
          php -r 'require "mon.php"; $x=LiteYahoo::benchmarkCandidates("JP"); if ($x!==["^TOPX","1306.T","^N225"]) {var_export($x); exit(1);} echo "JP benchmark fallback policy PASS\n";'
          rm -rf mon_runtime

      - name: Reference-only MS7 recommendation contract
        run: |
          set -eu
          php -r 'require "mon.php"; $a=["metrics"=>["RS20_pp"=>5,"last_close"=>110,"MA5"=>105,"MA20"=>100],"technical"=>["technical_qualified"=>true,"histogram"=>1]]; $m=LiteSwing::ms7FromAnalysis($a); if($m["code"]!=="M2") {var_export($m); exit(1);} echo "MS7 strong mapping PASS\n";'
          php -r 'require "mon.php"; $r=LiteMonitor::recommendThree([],[]); foreach(["KR","US","JP"] as $c){if(count($r[$c])!==3) exit(1); foreach($r[$c] as $x) if(($x["ms7"]["code"]??"")!=="W") exit(2);} echo "always-three fallback PASS\n";'
          php -r 'require "mon.php"; $rows=[["symbol_id"=>"KR|KOSPI|111111","country"=>"KR","name"=>"A","metrics"=>["RS20_pp"=>4,"R20"=>.1,"ADV20"=>100,"last_close"=>110,"MA5"=>105,"MA20"=>100],"technical"=>["technical_qualified"=>true,"histogram"=>1],"reason_codes"=>[]]]; $r=LiteMonitor::recommendThree($rows,["KR|KOSPI|111111","KR|KOSPI|222222","KR|KOSPI|333333"]); if(count($r["KR"])!==3||$r["KR"][0]["ms7"]["code"]!=="M2") exit(1); echo "evaluated plus pending fill PASS\n";'
          rm -rf mon_runtime
      - name: ChatGPT final authority contract
        run: |
          set -eu
          php -r 'require "mon.php"; $sel=[]; foreach([["KR","KOSPI","005930","삼성전자","M0"],["KR","KOSPI","105560","KB금융","M1"],["KR","KOSPI","000660","SK하이닉스","W"],["US","NASDAQ","AAPL","Apple","M1"],["US","NASDAQ","NVDA","NVIDIA","M2"],["US","NYSE","JPM","JPMorgan","M0"],["JP","TSE","7203","Toyota","M1"],["JP","TSE","6758","Sony","M0"],["JP","TSE","8306","MUFG","W"]] as $x){$sel[]=["symbol_id"=>$x[0]."|".$x[1]."|".$x[2],"name"=>$x[3],"ms7"=>["code"=>$x[4]],"reason"=>"ChatGPT independent reason", "risk_note"=>"Independent risk"];} $out=LiteMonitor::normalizeChatgptDecision($sel); if(count($out)!==9) exit(1); if($out[4]["symbol_id"]!=="US|NASDAQ|NVDA"||$out[4]["name"]!=="NVIDIA"||$out[4]["ms7"]["code"]!=="M2"||$out[4]["ms7"]["confidence"]!=="CHATGPT_FINAL") exit(2); echo "ChatGPT name+code+MS7 preservation PASS\n";'
          php -r 'require "mon.php"; $sel=[]; foreach([["KR","KOSPI","005930","Samsung"],["KR","KOSPI","105560","KB"]] as $x){$sel[]=["symbol_id"=>$x[0]."|".$x[1]."|".$x[2],"name"=>$x[3],"ms7"=>["code"=>"W"],"reason"=>"Independent reason here","risk_note"=>"Risk note"];} if(count(LiteMonitor::normalizeChatgptDecision($sel))!==2||LiteMonitor::normalizeChatgptDecision([])!==[]) exit(1); echo "partial and zero selections accepted without filler PASS\n";'
          php -r 'require "mon.php"; $sel=[]; foreach([["KR","KOSPI","005930"],["KR","KOSPI","105560"],["KR","KOSPI","000660"],["US","NASDAQ","AAPL"],["US","NASDAQ","NVDA"],["US","NYSE","JPM"],["JP","TSE","7203"],["JP","TSE","6758"],["JP","TSE","8306"]] as $x){$sel[]=["symbol_id"=>$x[0]."|".$x[1]."|".$x[2],"ms7"=>["code"=>"W"],"reason"=>"Independent reason here","risk_note"=>"Risk note"];} $ok=false; try{LiteMonitor::normalizeChatgptDecision($sel);}catch(LiteMonFault $e){$ok=$e->faultCode==="DECISION_NAME_REQUIRED";} if(!$ok) exit(1); echo "decision name required PASS\n";'
          grep -F "'authority'=>'chatgpt_final'" mon.php
          grep -F "'analysis_reference'" mon.php
          grep -F "DECISION_AUTHORITY_REQUIRED" mon.php
          grep -F "DECISION_NAME_REQUIRED" mon.php
          php -r 'require "mon.php"; $sel=[]; foreach([["005930","Samsung"],["000660","Hynix"],["105560","KB"],["035420","Naver"]] as $x)$sel[]=["symbol_id"=>"KR|KOSPI|".$x[0],"name"=>$x[1],"ms7"=>["code"=>"W"],"reason"=>"Independent current reason","risk_note"=>"Risk note"]; $ok=false; try{LiteMonitor::normalizeChatgptDecision($sel);}catch(LiteMonFault $e){$ok=$e->faultCode==="DECISION_LIMIT_INVALID";} if(!$ok) exit(1); echo "max-three per country PASS\n";'
          grep -F "\$x['name'].' ('.\$x['symbol_id'].') · MS7" mon.php
          rm -rf mon_runtime
      - name: Final-decision persistence failure injection
        run: |
          set -eu
          test_dir="$(mktemp -d)"
          trap 'rm -rf "$test_dir"' EXIT
          cp mon.php "$test_dir/mon.php"
          cmp -s mon.php "$test_dir/mon.php"
          MON_TEST_SOURCE="$test_dir/mon.php" php <<'PHP'
          <?php
          declare(strict_types=1);
          require getenv('MON_TEST_SOURCE');
          function ci_assert(bool $ok,string $message): void {if(!$ok)throw new RuntimeException($message);}
          function ci_call(LiteMonitor $monitor,string $method,array $args=[]) {$r=new ReflectionMethod(LiteMonitor::class,$method);$r->setAccessible(true);return $r->invokeArgs($monitor,$args);}
          final class CiGithub {
              public $files=[],$puts=[],$gets=[],$failBefore=[],$failAfter=[],$failRead=[],$badRead=[];
              public function seed(string $path,string $content): void {$this->files[$path]=['content'=>$content,'sha'=>lm_git_blob_sha($content),'commit_sha'=>null];}
              public function githubGet(string $path,bool $force=false): ?array {
                  $this->gets[]=[$path,$force];
                  $written=false;foreach($this->puts as $put)if($put['path']===$path)$written=true;
                  if($force&&$written&&($this->failRead[$path]??0)>0){$this->failRead[$path]--;throw new LiteMonFault('CI_READ_FAILED');}
                  $value=$this->files[$path]??null;
                  if($force&&$written&&($this->badRead[$path]??0)>0){$this->badRead[$path]--;return $value?array_merge($value,['content'=>$value['content'].'CORRUPT']):null;}
                  return $value;
              }
              public function githubPut(string $path,string $content,string $message,?string $oldSha=null): array {
                  if(($this->failBefore[$path]??0)>0){$this->failBefore[$path]--;throw new LiteMonFault('CI_PUT_FAILED');}
                  $current=$this->files[$path]??null;
                  ci_assert(($current['sha']??null)===$oldSha,'optimistic SHA precondition: '.$path);
                  $commit=sha1('ci-commit-'.count($this->puts));$sha=lm_git_blob_sha($content);
                  $this->files[$path]=['content'=>$content,'sha'=>$sha,'commit_sha'=>$commit];$this->puts[]=['path'=>$path,'content'=>$content];
                  if(($this->failAfter[$path]??0)>0){$this->failAfter[$path]--;throw new LiteMonFault('CI_COMMIT_ACK_LOST');}
                  return ['blob_sha'=>$sha,'commit_sha'=>$commit,'unchanged'=>false];
              }
              public function clearRequestCache(): void {}
              public function resetStats(): void {}
              public function stats(): array {return [];}
              public function get(): string {throw new RuntimeException('Market/network fetch is forbidden in publication recovery');}
          }
          function ci_monitor(CiGithub $http): LiteMonitor {
              $monitor=(new ReflectionClass(LiteMonitor::class))->newInstanceWithoutConstructor();
              $config=new LiteConfig();$config->githubToken='synthetic-ci-token';
              foreach(['cfg'=>$config,'http'=>$http] as $name=>$value){$r=new ReflectionProperty(LiteMonitor::class,$name);$r->setAccessible(true);$r->setValue($monitor,$value);}
              return $monitor;
          }
          function ci_reset(): CiGithub {
              foreach(LiteRuntime::FILES as $key){$path=LiteRuntime::path($key.'.php');if(is_file($path))unlink($path);}
              $http=new CiGithub();$http->seed('mon_data.json',lm_json(['contract'=>'MON-LITE-DATA-2.2','policy'=>MON_LITE_POLICY,'version'=>MON_LITE_VERSION,'build'=>MON_LITE_BUILD,'scan'=>['decision_status'=>'awaiting_chatgpt'],'results'=>[],'errors'=>[]]));
              return $http;
          }
          function ci_selected(): array {
              $out=[];foreach([['KR','KOSPI','005930','Samsung'],['US','NASDAQ','NVDA','NVIDIA'],['JP','TSE','7203','Toyota']] as $x)$out[]=['symbol_id'=>$x[0].'|'.$x[1].'|'.$x[2],'name'=>$x[3],'ms7'=>['code'=>'W'],'reason'=>'Fresh independent CI evidence','risk_note'=>'Evidence uncertainty'];
              return LiteMonitor::normalizeChatgptDecision($out);
          }
          function ci_decide(LiteMonitor $monitor,string $rid='ci-request',?array $selected=null,string $handoffSha='ci-handoff-sha'): void {
              $context=['outcome'=>$selected===[]?'no_candidates':'completed','conclusion'=>'Independent current review completed; preserve this final conclusion.','analysis_at'=>lm_iso(),'independent_sources'=>[['url'=>'https://example.com/source-a','checked_at'=>lm_iso()],['url'=>'https://example.org/source-b','checked_at'=>lm_iso()]]];
              ci_call($monitor,'saveDecision',[$rid,$selected??ci_selected(),['KR|KOSPI|999999'],'ci-evaluation',['KR'=>'KR current independent review','US'=>'US current independent review','JP'=>'JP current independent review'],$handoffSha,$context]);
          }
          function ci_saved(CiGithub $http,string $rid='ci-request'): void {
              $result=LiteRuntime::read('result');$data=lm_decode($http->files['mon_data.json']['content']);$response=lm_decode($http->files['mon_chatgpt_response.json']['content']);
              ci_assert(lm_get($result,'save_status')==='saved','local result must be saved');
              ci_assert(lm_get($result,'request_id')===$rid,'result request identity');
              ci_assert(lm_get($response,'request_id')===$rid&&lm_get($response,'status')==='saved','receipt request identity');
              ci_assert(lm_get($result,'pair_readback_verified')===true,'local pair verified');
              ci_assert(lm_get($result,'receipt_readback_verified')===true,'local receipt verified');
              ci_assert(lm_get(lm_get($data,'chatgpt_final'),'request_id')===$rid,'data final request identity');
              ci_assert(lm_get($response,'pair_readback_verified')===true,'receipt pair verified');
              foreach(['mon_result.md','mon_data.json','mon_chatgpt_response.json'] as $path){$seen=false;foreach($http->gets as $get)if($get[0]===$path&&$get[1])$seen=true;ci_assert($seen,'forced readback required: '.$path);}
              $conclusion=(string)lm_get($result,'conclusion','');ci_assert(strlen($conclusion)>=8&&strpos($http->files['mon_result.md']['content'],$conclusion)!==false,'conclusion retained in Markdown');
          }
          foreach(['mon_result.md','mon_data.json','mon_chatgpt_response.json'] as $failPath){
              foreach(['failBefore','failAfter','failRead','badRead'] as $failure){
                  $http=ci_reset();$http->{$failure}[$failPath]=1;$monitor=ci_monitor($http);$thrown=false;
                  try{ci_decide($monitor);}catch(Throwable $error){$thrown=true;}
                  ci_assert($thrown,'failure must be surfaced: '.$failure.' '.$failPath);
                  $pending=LiteRuntime::read('result');ci_assert(lm_get($pending,'save_status')!=='saved','must not mark saved before receipt: '.$failure.' '.$failPath);
                  ci_assert(in_array(lm_get($pending,'save_status'),['pending_remote','pending_receipt'],true),'durable pending status');
                  $frozen=lm_json(lm_get($pending,'outbox'));$first=(string)lm_get(lm_get($pending,'outbox'),'markdown','');
                  ci_assert($first!=='','durable Markdown exists before remote completion');
                  unset($monitor);$restarted=ci_monitor($http);ci_call($restarted,'retryPublication');ci_saved($http);
                  $oldOutbox=lm_decode($frozen);$newOutbox=lm_get(LiteRuntime::read('result'),'outbox');foreach(['markdown','data_json','response_json'] as $key){$prior=lm_get($oldOutbox,$key);if(is_string($prior))ci_assert(lm_get($newOutbox,$key)===$prior,'frozen outbox payload must survive restart: '.$key);}
                  ci_assert($http->files['mon_result.md']['content']===$first,'immutable result replay');
                  $puts=count($http->puts);ci_call(ci_monitor($http),'retryPublication');ci_assert(count($http->puts)===$puts,'saved retry must not rewrite remote files');
                  echo 'PASS failure+restart '.$failure.' '.$failPath."\n";
              }
          }
          $http=ci_reset();$monitor=ci_monitor($http);ci_decide($monitor,'ci-empty',[]);ci_saved($http,'ci-empty');
          ci_assert(lm_get(LiteRuntime::read('result'),'selected')===[],'zero-pick conclusion must not invent filler');
          echo "PASS zero-pick conclusion persistence\n";
          $http=ci_reset();$http->failBefore['mon_data.json']=1;$monitor=ci_monitor($http);
          try{ci_decide($monitor);}catch(Throwable $expected){}
          $pending=lm_json(LiteRuntime::read('result'));$before=count($http->puts);
          $summary=['scan_id'=>'ci-new-scan','at'=>lm_iso(),'done'=>0,'pending'=>1,'candidate_count'=>1,'eligible_count'=>0,'results'=>[],'errors'=>[]];
          try{ci_call($monitor,'publishData',[$summary,[['symbol_id'=>'KR|KOSPI|005930']]]);}catch(LiteMonFault $expected){}
          ci_assert(count($http->puts)===$before,'reference scan must not overwrite pending final');
          ci_assert(lm_json(LiteRuntime::read('result'))===$pending,'reference scan must preserve pending result');
          ci_call(ci_monitor($http),'retryPublication');ci_saved($http);
          echo "PASS pending final blocks reference overwrite\n";
          foreach([lm_iso(time()+60),null] as $newerAnalysisAt){
              $http=ci_reset();$http->failBefore['mon_data.json']=1;$monitor=ci_monitor($http);try{ci_decide($monitor);}catch(LiteMonFault $expected){}
              $pending=LiteRuntime::read('result');$selected=lm_json(lm_get($pending,'selected'));$before=count($http->puts);
              $newer=['contract'=>'MON-LITE-DATA-2.2','policy'=>MON_LITE_POLICY,'version'=>MON_LITE_VERSION,'build'=>MON_LITE_BUILD,'chatgpt_final'=>['authority'=>'chatgpt_final','request_id'=>'ci-newer-direct','decision_id'=>'ci-newer-direct-id','analysis_at'=>$newerAnalysisAt,'selected'=>[]]];
              $http->seed('mon_data.json',lm_json($newer));$http->seed('mon_result.md','Direct newer final must remain authoritative.');$dataBytes=$http->files['mon_data.json']['content'];
              ci_call(ci_monitor($http),'retryPublication');
              ci_assert(count($http->puts)===$before,'older pending must not write over changed direct final');
              ci_assert($http->files['mon_data.json']['content']===$dataBytes&&$http->files['mon_result.md']['content']==='Direct newer final must remain authoritative.','direct final pair retained');
              ci_assert(lm_get(LiteRuntime::read('result'),'save_status')!=='saved'&&lm_json(lm_get(LiteRuntime::read('result'),'selected'))===$selected,'older pending retained without false success');
              ci_assert(lm_get(ci_monitor($http)->state(),'last_publication_error')==='CONCURRENT_DECISION_CONFLICT','concurrent final conflict is explicit');
              echo 'PASS newer direct final protects against old pending '.($newerAnalysisAt===null?'identity guard':'freshness guard')."\n";
          }
          foreach([false,true] as $wrongReceiptPolicy){
              $http=ci_reset();$http->seed('mon_chatgpt_handoff.json',lm_json(['contract'=>'MON-LITE-BRIDGE-1.0','policy'=>MON_LITE_POLICY,'stage'=>'decision','request_id'=>'ci-request','authority'=>'chatgpt_final','independent_analysis'=>true]));LiteRuntime::write('request',(object)['request_id'=>'ci-request']);
              $http->failBefore['mon_data.json']=1;try{ci_decide(ci_monitor($http),'ci-request',null,$http->files['mon_chatgpt_handoff.json']['sha']);}catch(LiteMonFault $expected){}
              $pending=LiteRuntime::read('result');$originalOutbox=lm_json(lm_get($pending,'outbox'));$before=count($http->puts);
              $final=['contract'=>'MON-LITE-RESULT-2.1','policy'=>MON_LITE_POLICY,'authority'=>'chatgpt_final','independent_analysis'=>true,'request_id'=>'ci-direct-verified','evaluation_id'=>'ci-direct-eval','decision_id'=>'ci-direct-verified-id','analysis_at'=>lm_iso(time()+60),'selected'=>[]];
              $http->seed('mon_result.md','Verified newer independent final conclusion.');$http->seed('mon_data.json',lm_json(['contract'=>'MON-LITE-DATA-2.2','policy'=>MON_LITE_POLICY,'chatgpt_final'=>$final]));
              $receipt=['contract'=>'MON-LITE-BRIDGE-1.0','policy'=>$wrongReceiptPolicy?'MON-WRONG-POLICY':MON_LITE_POLICY,'stage'=>'decision','authority'=>'chatgpt_final','status'=>'saved','request_id'=>$final['request_id'],'evaluation_id'=>$final['evaluation_id'],'decision_id'=>$final['decision_id'],'pair_readback_verified'=>true,'data_blob_sha'=>$http->files['mon_data.json']['sha'],'result_blob_sha'=>$http->files['mon_result.md']['sha']];
              $http->seed('mon_chatgpt_response.json',lm_json($receipt));ci_call(ci_monitor($http),'retryPublication');$result=LiteRuntime::read('result');
              ci_assert(count($http->puts)===$before,'supersession verification must not mutate remote results');ci_assert(lm_json(lm_get($result,'outbox'))===$originalOutbox,'supersession retains old durable outbox');
              if($wrongReceiptPolicy){ci_assert(lm_get($result,'save_status')!=='superseded','wrong-policy receipt cannot supersede old pending');echo "PASS wrong-policy receipt does not supersede pending\n";}
