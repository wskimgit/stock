          final class NaverFixtureTransport {public $calls=[],$body,$chart,$yahooFault=null;public function __construct(string $body,string $chart=''){$this->body=$body;$this->chart=$chart;}public function get(string $url,array $headers=[],int $timeout=8): string {$this->calls[]=['url'=>$url,'timeout'=>$timeout];if(strpos($url,'fchart.stock.naver.com/')!==false)return $this->body;if(strpos($url,'/finance/chart/')!==false){if($this->yahooFault!==null)throw new LiteMonFault($this->yahooFault);return $this->chart;}throw new RuntimeException('Unexpected offline request');}}
          function nav_provider(string $body,string $chart=''): array {$http=new NaverFixtureTransport($body,$chart);$provider=(new ReflectionClass(LiteYahoo::class))->newInstanceWithoutConstructor();nav_prop($provider,'http',$http,true);$provider->beginTurn();return [$provider,$http];}
          function nav_fault(string $body,string $name): void {[$provider,$http]=nav_provider($body);$fault=null;try{$provider->naverBenchmark('KR','KOSPI',220);}catch(LiteMonFault $e){$fault=$e->faultCode;}nav_check($fault!==null,$name.' rejected');nav_check(count($http->calls)===1,$name.' costs one bounded provider request');}
