          $truth=[];foreach([['pending_remote',false,false,false],['pending_receipt',true,false,false],['saved',true,false,false],['saved',true,true,true],['superseded',true,true,false]] as $case){LiteRuntime::write('result',(object)['save_status'=>$case[0],'pair_readback_verified'=>$case[1],'receipt_readback_verified'=>$case[2],'decision_id'=>'ci-final','request_id'=>'ci-request','saved_at'=>lm_iso(),'receipt_blob_sha'=>'ci-blob']);$status=$monitor->finalSaveStatus();status_assert($status['status']===$case[0]&&$status['last_local_receipt_verified']===$case[3]&&$status['scope']==='last_local_receipt','save indication requires exact pair and receipt completion: '.$case[0]);$truth[]=$status;}
          echo lm_json(['source_sha256'=>$sourceSha,'installed_identity'=>$identity,'prior_daemon_preserved'=>true,'start_wait_identity'=>true,'heartbeat_transition'=>true,'save_truth_cases'=>$truth])."\n";
