      - name: Bounded US daily envelope recovery
        run: |
          set -eu
          test_dir="$(mktemp -d)"
          trap 'rm -rf "$test_dir"' EXIT
          cp mon.php "$test_dir/mon.php"
          cmp -s mon.php "$test_dir/mon.php"
          cat >"$test_dir/envelope-fixture.php" <<'PHP'
          <?php
          declare(strict_types=1);

          /* Exact-source, offline provider-response tests. No production source rewriting. */
          $envelopeSource=getenv('MON_TEST_SOURCE');
          if(!is_string($envelopeSource)||!is_file($envelopeSource))throw new RuntimeException('MON_TEST_SOURCE must identify source under test');
          require $envelopeSource;
          $envelopeCases=[];
          function env_check(bool $pass,string $case): void {global $envelopeCases;$envelopeCases[]=['case'=>$case,'status'=>$pass?'PASS':'FAIL'];if(!$pass)throw new RuntimeException('Envelope fixture failed: '.$case);}
          function env_prop($object,string $name,$value): void {$p=new ReflectionProperty(get_class($object),$name);$p->setAccessible(true);$p->setValue($object,$value);}
          function env_stamp(string $date,string $clock): int {return (new DateTimeImmutable($date.' '.$clock,new DateTimeZone('America/New_York')))->getTimestamp();}
          function env_chart(array $timestamps,array $quote,string $currency='USD'): string {
              $start=env_stamp('2026-10-16','09:30:00');
              return lm_json(['chart'=>['result'=>[['meta'=>['currency'=>$currency,'exchangeTimezoneName'=>'America/New_York','timezone'=>'EDT','gmtoffset'=>-14400,'currentTradingPeriod'=>['regular'=>['timezone'=>'EDT','start'=>$start,'end'=>$start+23400,'gmtoffset'=>-14400]]],'timestamp'=>$timestamps,'indicators'=>['quote'=>[$quote]]]],'error'=>null]]);
          }
          function env_daily(bool $valid=false,string $currency='USD',string $mode='complete'): string {
              $timestamps=[];$quote=['open'=>[],'high'=>[],'low'=>[],'close'=>[],'volume'=>[]];$end=env_stamp('2026-10-16','09:30:00');
              for($i=0;$i<60;$i++){$timestamps[]=$end-(59-$i)*86400;$quote['open'][]=100.0;$quote['high'][]=$i===59&&$mode==='close_mismatch'?102.5:($i===59&&!$valid?100.99:101.01);$quote['low'][]=$i===59&&$mode==='close_mismatch'?100.01:($i===59&&$mode==='open_mismatch'?99.0:99.99);$quote['close'][]=101.0;$quote['volume'][]=123456789.0;}
              return env_chart($timestamps,$quote,$currency);
          }
          function env_intraday(string $mode): string {
              $timestamps=[];$quote=['open'=>[],'high'=>[],'low'=>[],'close'=>[],'volume'=>[]];$start=env_stamp('2026-10-16','09:30:00');
              for($i=0;$i<78;$i++){
                  if($mode==='incomplete'&&$i===40)continue;
                  $ts=$start+300*$i;if($mode==='misaligned'&&$i===40)$ts+=60;if($mode==='wrong_date')$ts-=86400;
                  $open=100+$i/78;$close=100+($i+1)/78;$high=max($open,$close)+0.005;$low=min($open,$close)-0.005;
                  if($mode==='large_correction'&&$i===40)$high=110.0;
                  if($mode==='close_mismatch'&&$i===40)$high=102.5;
                  if($mode==='close_mismatch'&&$i===77){$close=102.0;$high=102.005;}
                  if($mode==='open_mismatch'&&$i===0){$open=99.5;$low=99.495;}
                  if($mode==='open_mismatch'&&$i===40)$low=99.0;
                  $timestamps[]=$ts;$quote['open'][]=$open;$quote['high'][]=$high;$quote['low'][]=$low;$quote['close'][]=$close;$quote['volume'][]=1000.0;
              }
              return env_chart($timestamps,$quote,$mode==='currency_mismatch'?'JPY':'USD');
          }
          final class EnvelopeFixtureTransport {
              public $calls=[];public $mode;public $valid;public $currency;public $actualDaily;public $actualIntraday;
              public function __construct(string $mode,bool $valid=false,string $currency='USD'){$this->mode=$mode;$this->valid=$valid;$this->currency=$currency;if($mode==='actual'){$dir=getenv('MON_ENVELOPE_PROVIDER_FIXTURE_DIR')?:__DIR__.'/root_provider_probe';$this->actualDaily=file_get_contents($dir.'/daily.json');$this->actualIntraday=file_get_contents($dir.'/intraday.json');if(!is_string($this->actualDaily)||!is_string($this->actualIntraday))throw new RuntimeException('Actual provider fixture unavailable');}}
              public function get(string $url,array $headers=[],int $timeout=8): string {
                  $query=[];parse_str((string)parse_url($url,PHP_URL_QUERY),$query);$this->calls[]=['interval'=>$query['interval']??null,'period1'=>$query['period1']??null,'period2'=>$query['period2']??null,'timeout'=>$timeout,'url'=>$url];
                  if($this->mode==='actual'&&($query['interval']??null)==='1d')return $this->actualDaily;
                  if($this->mode==='actual'&&($query['interval']??null)==='5m')return $this->actualIntraday;
                  if(($query['interval']??null)==='1d')return env_daily($this->valid,$this->currency,$this->mode);
                  if(($query['interval']??null)==='5m')return env_intraday($this->mode);
                  throw new RuntimeException('Unexpected provider request in offline envelope fixture');
              }
          }
          function env_provider(string $mode,bool $valid=false,string $currency='USD'): array {
              $transport=new EnvelopeFixtureTransport($mode,$valid,$currency);$yahoo=(new ReflectionClass(LiteYahoo::class))->newInstanceWithoutConstructor();env_prop($yahoo,'http',$transport);$yahoo->beginTurn();return [$yahoo,$transport];
          }
          $symbol=['symbol_id'=>'US|NASDAQ|CPUENV','symbol'=>'CPUENV','country'=>'US','exchange'=>'NASDAQ','currency'=>'USD','name'=>'Envelope fixture'];
          $envelopeScenarios=[];

          [$yahoo,$http]=env_provider('complete');$rows=$yahoo->daily($symbol,60);$last=$rows[count($rows)-1]??null;
          env_check(count($rows)===60&&is_array($last)&&$last[0]==='2026-10-16','complete regular-session evidence preserves the daily history and latest date');
          env_check($last[1]===100.0&&$last[4]===101.0&&$last[5]===123456789.0,'recovery preserves exact daily open, close and volume');
          env_check($last[2]>=101.0&&$last[2]<=101.006&&$last[3]<=100.0&&$last[3]>=99.99,'recovery uses a bounded intraday price envelope');
          env_check(abs($last[2]-101.005)<1e-8&&$last[3]===99.99,'recovery uses observed regular-session high and preserves an already valid daily low');
          env_check(array_column($http->calls,'interval')===['1d','5m'],'one invalid latest row incurs one bounded intraday request');
          env_check($http->calls[1]['period2']-$http->calls[1]['period1']<=86400,'intraday recovery requests at most one session date');
          $stats=$yahoo->stats();$recovery=$yahoo->recoveryFor($symbol['symbol_id']);
          env_check(($stats['yahoo_envelope_recovery_requests']??null)===1&&($stats['yahoo_envelope_recoveries']??null)===1,'successful recovery reports both request cost and accepted count');
          env_check(($recovery['method']??null)==='completed_regular_5m_envelope'&&($recovery['date']??null)==='2026-10-16'&&($recovery['regular_bar_count']??null)===78&&($recovery['daily_open_close_volume_preserved']??null)===true,'accepted recovery exposes dated complete-session provenance');
          $provenanceQuery=[];parse_str((string)parse_url((string)($recovery['source_url']??''),PHP_URL_QUERY),$provenanceQuery);
          env_check(($provenanceQuery['interval']??null)==='5m'&&basename((string)parse_url((string)($recovery['source_url']??''),PHP_URL_PATH))==='CPUENV','recovery provenance identifies the exact ticker and intraday source');
          $envelopeScenarios[]=['profile'=>'complete_78_regular_bars','latest_row'=>$last,'stats'=>$yahoo->stats(),'calls'=>$http->calls];

          foreach(['incomplete','misaligned','large_correction','close_mismatch','open_mismatch','wrong_date','currency_mismatch'] as $mode){
              [$yahoo,$http]=env_provider($mode);$fault=null;try{$yahoo->daily($symbol,60);}catch(LiteMonFault $e){$fault=$e->faultCode;}
              env_check($fault!==null,'unsafe intraday evidence cannot repair the latest daily bar: '.$mode);
              env_check(array_column($http->calls,'interval')===['1d','5m'],'rejected recovery is bounded to one extra request: '.$mode);
              $stats=$yahoo->stats();env_check(($stats['yahoo_envelope_recovery_requests']??null)===1&&($stats['yahoo_envelope_recoveries']??null)===0&&$yahoo->recoveryFor($symbol['symbol_id'])===null,'rejected evidence cannot publish successful recovery provenance: '.$mode);
              $envelopeScenarios[]=['profile'=>$mode,'rejected_with'=>$fault,'stats'=>$yahoo->stats(),'calls'=>$http->calls];
          }

          [$yahoo,$http]=env_provider('complete',true);$rows=$yahoo->daily($symbol,60);
          env_check(count($rows)===60&&array_column($http->calls,'interval')===['1d'],'valid daily history makes no intraday recovery request');
          $envelopeScenarios[]=['profile'=>'valid_daily_no_recovery','stats'=>$yahoo->stats(),'calls'=>$http->calls];

          foreach([['KR','KOSPI','005930','KRW'],['JP','TSE','7203','JPY']] as $cc){
              $foreign=['symbol_id'=>$cc[0].'|'.$cc[1].'|'.$cc[2],'symbol'=>$cc[2],'country'=>$cc[0],'exchange'=>$cc[1],'currency'=>$cc[3],'name'=>'Non-US fixture'];
              [$yahoo,$http]=env_provider('complete',false,$cc[3]);$fault=null;try{$yahoo->daily($foreign,60);}catch(LiteMonFault $e){$fault=$e->faultCode;}
              env_check($fault!==null&&array_column($http->calls,'interval')===['1d'],'US recovery does not cross country or exchange identity: '.$cc[0]);
              $envelopeScenarios[]=['profile'=>'non_us_'.$cc[0],'rejected_with'=>$fault,'calls'=>$http->calls];
          }

          $probeDir=getenv('MON_ENVELOPE_PROVIDER_FIXTURE_DIR')?:__DIR__.'/root_provider_probe';
          if(is_file($probeDir.'/daily.json')&&is_file($probeDir.'/intraday.json')){
              $actual=['symbol_id'=>'US|NYSE|KO','symbol'=>'KO','country'=>'US','exchange'=>'NYSE','currency'=>'USD','name'=>'Coca-Cola'];
              [$yahoo,$http]=env_provider('actual');$daily=lm_array(lm_decode($http->actualDaily));$intraday=lm_array(lm_decode($http->actualIntraday));$day=$daily['chart']['result'][0];$intra=$intraday['chart']['result'][0];$q=$day['indicators']['quote'][0];$lastIndex=count($day['timestamp'])-1;$date=gmdate('Y-m-d',$day['timestamp'][$lastIndex]);$start=env_stamp($date,'09:30:00');$end=$start+23400;$regular=[];foreach($intra['timestamp'] as $i=>$t)if($t>=$start&&$t<$end)$regular[]=$i;
              env_check(count($intra['timestamp'])===79&&count($regular)===78,'recorded KO evidence contains 78 regular bars and one closing-marker extra');
              $rows=$yahoo->daily($actual,60);$last=$rows[count($rows)-1];
              env_check(count($rows)===count($day['timestamp'])&&$last[0]===$date,'recorded provider replay retains all completed daily rows');
              env_check($last[1]===(float)$q['open'][$lastIndex]&&$last[2]===(float)$q['high'][$lastIndex]&&$last[4]===(float)$q['close'][$lastIndex]&&$last[5]===(float)$q['volume'][$lastIndex],'recorded provider repair preserves daily open, valid high, close and volume');
              $iq=$intra['indicators']['quote'][0];$regularLow=INF;foreach($regular as $i)$regularLow=min($regularLow,(float)$iq['low'][$i]);
              env_check($last[3]===$regularLow&&$last[3]<=(float)$q['open'][$lastIndex],'recorded provider invalid daily low is repaired from complete regular-session evidence');
              $recovery=$yahoo->recoveryFor($actual['symbol_id']);env_check(($recovery['regular_bar_count']??null)===78&&($recovery['date']??null)===$date,'recorded provider replay publishes exact-session provenance');
              env_check(array_column($http->calls,'interval')===['1d','5m'],'recorded provider repair also uses only one extra request');
              $envelopeScenarios[]=['profile'=>'actual_KO_recorded_provider_replay','status'=>'PASS','input_sha256'=>['daily'=>hash('sha256',$http->actualDaily),'intraday'=>hash('sha256',$http->actualIntraday)],'raw_intraday_timestamps'=>count($intra['timestamp']),'regular_intraday_timestamps'=>count($regular),'latest_row'=>$last,'stats'=>$yahoo->stats(),'recovery'=>$recovery];
          }else $envelopeScenarios[]=['profile'=>'actual_KO_recorded_provider_replay','status'=>'SKIPPED','reason'=>'Supplementary recorded provider inputs not supplied'];

          echo lm_json(['scenario'=>'exact_source_bounded_us_intraday_envelope','status'=>'PASS','source_sha256'=>hash_file('sha256',$envelopeSource),'fixture_sha256'=>hash_file('sha256',__FILE__),'case_count'=>count($envelopeCases),'cases'=>$envelopeCases,'scenarios'=>$envelopeScenarios])."\n";
          PHP
          MON_TEST_SOURCE="$test_dir/mon.php" php -d memory_limit=96M "$test_dir/envelope-fixture.php"

