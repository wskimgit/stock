          if($mode==='queue'){
              final class MemQueueHttp {public function clearRequestCache(): void {}public function resetStats(): void {}public function stats(): array {return [];}public function githubGet(string $path,bool $force=false): ?array {return null;}public function releasePayloads(): void {}}
