name: MON ChatGPT handoff integration
on:
  pull_request:
    paths:
      - mon.php
      - mon_chatgpt_bridge.php
      - monitor.md
      - mon_wiki.md
      - mon_chatgpt_handoff.md
      - tests/mon_chatgpt_bridge_test.php
      - .github/workflows/mon_chatgpt_handoff.yml
  push:
    branches:
      - fix/mon-chatgpt-handoff-20261013
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: zlib, curl, json
          coverage: none
      - name: Confirm PHP 7.4 source syntax
        run: |
          php -v
          php -l mon.php
          php -l mon_chatgpt_bridge.php
          php -l tests/mon_chatgpt_bridge_test.php
      - name: Synthetic candidate to saved selection handoff
        run: php -d memory_limit=96M tests/mon_chatgpt_bridge_test.php
      - name: Read-only actual MON payload capacity (no market requests)
        run: php -d memory_limit=96M tests/mon_chatgpt_bridge_observed.php
      - name: Actual MON-size atomic archive intake against fake Git
        run: php -d memory_limit=96M tests/mon_chatgpt_bridge_compaction_test.php
